[project]
name = "tracelayer-decision-backend"
version = "0.1.0"
requires-python = "==3.13.3"
dependencies = [
    "fastapi==0.115.11",
    "uvicorn[standard]==0.34.0",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
